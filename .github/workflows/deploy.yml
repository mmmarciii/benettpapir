name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_FRONTEND_PATH: ${{ secrets.SERVER_FRONTEND_PATH }}
          SERVER_BACKEND_PATH: ${{ secrets.SERVER_BACKEND_PATH }}
          BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -e
          for name in SERVER_HOST SERVER_USER SERVER_PORT SERVER_SSH_KEY SERVER_FRONTEND_PATH SERVER_BACKEND_PATH BACKEND_PORT ADMIN_USERNAME ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        shell: bash
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Verify SSH access
        shell: bash
        run: |
          set -e
          ssh -o BatchMode=yes -o ConnectTimeout=15 -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "echo SSH_OK && pwd"

      - name: Deploy files to server
        shell: bash
        run: |
          rsync -az --delete -e "ssh -p ${{ secrets.SERVER_PORT }}" frontend/dist/ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_FRONTEND_PATH }}/"
          rsync -az --delete -e "ssh -p ${{ secrets.SERVER_PORT }}" --exclude "node_modules" --exclude ".env" backend/ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_BACKEND_PATH }}/"

      - name: Install backend deps and restart service
        shell: bash
        run: |
          ssh -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" '
            set -e
            cd "${{ secrets.SERVER_BACKEND_PATH }}"
            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi
            export PORT="${{ secrets.BACKEND_PORT }}"
            export ADMIN_USERNAME="${{ secrets.ADMIN_USERNAME }}"
            export ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}"
            pm2 restart benettpapir-backend --update-env || pm2 start server.js --name benettpapir-backend --update-env
            pm2 save
          '
